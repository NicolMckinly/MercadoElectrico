# =====================================================================
# EL "DESPERTADOR" DE GITHUB (GitHub Actions) - Reporte mensual de gas
# ---------------------------------------------------------------------
# Orden de trabajo:
#   1. ¿Hoy es el último día hábil? Si no, se vuelve a dormir.
#   2. El robot va al BEC y descarga los datos nuevos de los mercados
#      primario y secundario.
#   3. Guarda en GitHub los archivos que se hayan descargado bien.
#   4. Arma el reporte y lo envía por correo. Si el robot falló, el
#      reporte sale igual con los últimos datos guardados y un aviso.
#   5. Guarda las fotos del robot y el reporte en la pestaña Actions.
# =====================================================================

name: Reporte mensual de gas

on:
  # Despertador automático: días 24 al 31 de cada mes, 10:00 a.m. Colombia.
  schedule:
    - cron: "0 15 24-31 * *"

  # Botón manual "Run workflow".
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes a reportar (AAAA-MM). Vacío = mes actual"
        required: false
        default: ""
      solo_descargar:
        description: "Solo probar el robot (descarga datos, no envía correo)"
        type: boolean
        default: false

# Permiso para que el robot pueda guardar el archivo nuevo en el repositorio.
permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bogota
    # El proyecto de gas vive en la carpeta reporte-gas del repositorio.
    defaults:
      run:
        working-directory: reporte-gas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Paso 1: el portero. Con el botón manual siempre "toca".
      - name: ¿Toca hacer el reporte hoy?
        id: hoy
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "toca=si" >> "$GITHUB_OUTPUT"
          elif python -c "from calendario import hoy_es_ultimo_dia_habil as f; import sys; sys.exit(0 if f() else 1)"; then
            echo "toca=si" >> "$GITHUB_OUTPUT"
          else
            echo "toca=no" >> "$GITHUB_OUTPUT"
            echo "Hoy no es el último día hábil del mes. No hago nada."
          fi

      # Paso 2: instalar el navegador invisible y mandar al robot.
      #   "continue-on-error" = si el robot falla, seguimos igual con el reporte.
      - name: Instalar navegador para el robot
        if: steps.hoy.outputs.toca == 'si'
        run: python -m playwright install --with-deps chromium

      - name: Robot descarga datos del BEC
        id: descarga
        if: steps.hoy.outputs.toca == 'si'
        continue-on-error: true
        run: python descargar_bec.py

      # Paso 3: guardar los archivos nuevos en GitHub (solo los que cambiaron).
      #   Corre aunque el robot haya fallado en un mercado: así se guarda
      #   el que sí salió bien.
      - name: Guardar datos nuevos en el repositorio
        if: steps.hoy.outputs.toca == 'si'
        run: |
          git config user.name "robot-reporte-gas"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/puntos.xlsx datos/secundario.xlsx
          if git diff --cached --quiet; then
            echo "Los datos no cambiaron desde la última vez."
          else
            git commit -m "Datos BEC actualizados $(date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      # Paso 4: armar y enviar el reporte.
      - name: Generar y enviar reporte
        if: steps.hoy.outputs.toca == 'si' && inputs.solo_descargar != true
        env:
          GMAIL_USUARIO: ${{ secrets.CORREO_REMITENTE }}
          GMAIL_CLAVE_APP: ${{ secrets.CORREO_CONTRASENA_APP }}
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
          MES_ELEGIDO: ${{ github.event.inputs.mes }}
          DESCARGA_FALLIDA: ${{ steps.descarga.outcome == 'failure' && '1' || '0' }}
        run: |
          if [ -n "$MES_ELEGIDO" ]; then
            python generar_reporte.py --mes "$MES_ELEGIDO" --enviar
          else
            python generar_reporte.py --enviar
          fi

      # Paso 5: guardar las fotos del robot y el reporte (para revisarlos).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fotos-del-robot
          path: reporte-gas/capturas/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-gas
          path: reporte-gas/salida/
          if-no-files-found: ignore
