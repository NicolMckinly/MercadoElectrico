# =====================================================================
# EL "DESPERTADOR" DE GITHUB (GitHub Actions) - Reporte mensual de gas
# =====================================================================

name: Reporte mensual de gas

on:
  # Despertador automático: días 24 al 31 de cada mes, 5:00 p.m. Colombia.
  # El programa revisa si es el último día hábil; si no, no hace nada.
  schedule:
    - cron: "0 22 24-31 * *"

  # Botón manual "Run workflow", con una cajita para elegir el mes.
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes a reportar (AAAA-MM). Vacío = mes actual"
        required: false
        default: ""

jobs:
  generar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bogota
    # El proyecto de gas vive en la carpeta reporte-gas del repositorio.
    defaults:
      run:
        working-directory: reporte-gas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generar y enviar reporte
        env:
          GMAIL_USUARIO: ${{ secrets.CORREO_REMITENTE }}
          GMAIL_CLAVE_APP: ${{ secrets.CORREO_CONTRASENA_APP }}
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
          MES_ELEGIDO: ${{ github.event.inputs.mes }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python generar_reporte.py --solo-ultimo-dia-habil --enviar
          elif [ -n "$MES_ELEGIDO" ]; then
            python generar_reporte.py --mes "$MES_ELEGIDO" --enviar
          else
            python generar_reporte.py --enviar
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: reporte-gas
          path: reporte-gas/salida/
          if-no-files-found: ignore
