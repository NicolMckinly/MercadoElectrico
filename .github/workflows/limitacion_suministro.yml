name: Limitación de suministro semanal

on:
  schedule:
    # 17:00 UTC = 12:00 m. (mediodía) hora Colombia, todos los viernes
    - cron: "0 17 * * 5"
  workflow_dispatch: {}  # permite lanzarlo manualmente desde la pestaña Actions, para probar

jobs:
  limitacion-suministro:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preparar Chrome para Selenium
        uses: browser-actions/setup-chrome@v1

      - name: Instalar dependencias
        run: |
          pip install selenium requests openpyxl

      - name: Ejecutar el proceso completo
        working-directory: LimitacionSuministro
        env:
          TEAMS_WEBHOOK_LIMITACION: ${{ secrets.TEAMS_WEBHOOK_LIMITACION }}
        run: python main_limitacion.py

      - name: Guardar diagnóstico si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-error
          path: |
            LimitacionSuministro/error_diagnostico*.png
            LimitacionSuministro/error_pagina*.html
          if-no-files-found: ignore
